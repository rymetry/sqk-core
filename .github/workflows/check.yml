name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8
      - name: Run repository checks
        run: uv run scripts/check.py
      - name: Run tests
        run: uv run --with pytest --with jsonschema --with pyyaml pytest tests/ -v
