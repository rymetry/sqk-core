    practical_impact: >
      特性名・サブ特性構成に変更なし。2011年版のテンプレートをそのまま
      引き継いで良い領域。
    subcharacteristic_changes:
      added: []
      replaced: []

  - change_type: "特性名変更"
    id_2011: "portability"
    name_2011_ja: "移植性"
    name_2011_en: "Portability"
    id_2023: "flexibility"
    name_2023_ja: "柔軟性"
    name_2023_en: "Flexibility"
    jis_status: "◎（JIS X 25010:2025 序文で確認された公式訳語）"
    practical_impact: >
      移植性テンプレートに拡張性（スケーラビリティ）観点を追加する必要がある。
    subcharacteristic_changes:
      added: ["拡張性"]
      replaced: []

  - change_type: "新設特性"
    id_2011: null
    name_2011_ja: null
    name_2011_en: null
    id_2023: "safety"
    name_2023_ja: "安全性"
    name_2023_en: "Safety"
    jis_status: "◎（JIS X 25010:2025 序文で確認された公式訳語）"
    practical_impact: >
      安全関連システムでなくても、要求分析の段階で安全性の要否判断を
      組み込む必要がある。2011年版ベースのテンプレートを使い続けると
      この観点が構造的に抜け落ちる。
    subcharacteristic_changes:
      added: []
      replaced: []

